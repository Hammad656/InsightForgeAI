x-app-hardening: &app-hardening
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,nosuid,nodev,size=128m"]
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    <<: *app-hardening
    mem_limit: 768m
    stop_grace_period: 30s
    build: ./backend
    env_file: ./backend/.env
    environment:
      REPORT_DIRECTORY: /var/lib/insightforge/reports
    volumes:
      - report_data:/var/lib/insightforge/reports:ro
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports:
      - "127.0.0.1:8000:8000"
  worker:
    <<: *app-hardening
    mem_limit: 1536m
    stop_grace_period: 5m
    healthcheck:
      disable: true
    build: ./backend
    env_file: ./backend/.env
    environment:
      REPORT_DIRECTORY: /var/lib/insightforge/reports
    volumes:
      - report_data:/var/lib/insightforge/reports
    command: ["celery", "-A", "app.jobs.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  scheduler:
    <<: *app-hardening
    mem_limit: 384m
    healthcheck:
      disable: true
    build: ./backend
    env_file: ./backend/.env
    command: ["celery", "-A", "app.jobs.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/insightforge-beat"]
    depends_on:
      redis: {condition: service_healthy}
  web:
    <<: *app-hardening
    mem_limit: 768m
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
volumes:
  postgres_data:
  report_data:
