x-app-hardening: &app-hardening
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,nosuid,nodev,size=128m"]
  restart: unless-stopped

x-backend-environment: &backend-environment
  DATABASE_URL: postgresql+psycopg://insightforge_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
  MIGRATION_DATABASE_URL: ""
  REDIS_URL: redis://redis:6379/0
  REPORT_DIRECTORY: /var/lib/insightforge/reports

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    <<: *app-hardening
    restart: "no"
    build: ./backend
    healthcheck:
      disable: true
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *app-hardening
    mem_limit: 768m
    stop_grace_period: 30s
    build: ./backend
    env_file: ./backend/.env
    environment: *backend-environment
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=8).close()"]
      interval: 10s
      timeout: 9s
      start_period: 15s
      retries: 5
    volumes:
      - report_data:/var/lib/insightforge/reports:ro
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    ports:
      - "127.0.0.1:8000:8000"
  worker:
    <<: *app-hardening
    mem_limit: 1536m
    stop_grace_period: 5m
    healthcheck:
      disable: true
    build: ./backend
    env_file: ./backend/.env
    environment: *backend-environment
    volumes:
      - report_data:/var/lib/insightforge/reports
    command: ["celery", "-A", "app.jobs.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
  scheduler:
    <<: *app-hardening
    mem_limit: 384m
    healthcheck:
      disable: true
    build: ./backend
    env_file: ./backend/.env
    environment: *backend-environment
    command: ["celery", "-A", "app.jobs.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/insightforge-beat"]
    depends_on:
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
  web:
    <<: *app-hardening
    mem_limit: 768m
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres_data:
  report_data:
