name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_owner
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: insightforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      source:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: source_owner
          POSTGRES_PASSWORD: source_owner_fixture
          POSTGRES_DB: external_fixture
        ports: ["15439:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      MIGRATION_DATABASE_URL: postgresql+psycopg://ci_owner:ci_only_password@localhost:5432/insightforge_test
      DATABASE_URL: postgresql+psycopg://insightforge_app:ci_app_only@localhost:5432/insightforge_test
      REDIS_URL: redis://localhost:6379/0
      COOKIE_SECURE: "false"
      M2_INTEGRATION: "1"
      M2_LIVE_WORKER: "1"
      M4_INTEGRATION: "1"
      M5_INTEGRATION: "1"
      M5_LIVE_WORKER: "1"
      M6A_INTEGRATION: "1"
      M6A_LIVE_WORKER: "1"
      M6B_INTEGRATION: "1"
      M6B_LIVE_WORKER: "1"
      M6C_INTEGRATION: "1"
      M6C_LIVE_WORKER: "1"
      M6D_INTEGRATION: "1"
      M6E_INTEGRATION: "1"
      M7_INTEGRATION: "1"
      REPORT_DIRECTORY: /tmp/insightforge-ci-private-reports
      REPORT_STORAGE: local
      AI_PROVIDER: disabled
      REPORTING_DATABASE_URL: postgresql+psycopg://insightforge_reporting:ci_reporting_only@localhost:5432/insightforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip==26.2
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests alembic
      - run: mypy --ignore-missing-imports app
      - env:
          SOURCE_CONTAINER: ${{ job.services.source.id }}
        run: |
          fixture_dir=$(mktemp -d)
          python tests/m6e_tls.py "$SOURCE_CONTAINER" "$fixture_dir"
          export M6E_SOURCE_CA="$fixture_dir/untrusted.crt" M6E_TRUSTED_SOURCE_CA="$fixture_dir/server.crt"
          export M6E_SECRET_FIXTURE_DIR="$fixture_dir/credentials"
          echo "M6E_SOURCE_CA=$M6E_SOURCE_CA" >> "$GITHUB_ENV"
          echo "M6E_TRUSTED_SOURCE_CA=$M6E_TRUSTED_SOURCE_CA" >> "$GITHUB_ENV"
          python tests/m6e_source.py
      - run: |
          PGPASSWORD=ci_only_password psql -h localhost -U ci_owner -d insightforge_test -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE insightforge_app LOGIN PASSWORD 'ci_app_only' NOSUPERUSER NOBYPASSRLS NOINHERIT"
          alembic upgrade 0001_foundation
          alembic current
          alembic upgrade head
          alembic current
          PGPASSWORD=ci_only_password psql -h localhost -U ci_owner -d insightforge_test -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE insightforge_reporting LOGIN PASSWORD 'ci_reporting_only'"
      - run: |
          PYTHONPATH="$PWD/tests:$PYTHONPATH" celery -A m6b_worker:celery_app worker --pool=solo --loglevel=WARNING > /tmp/insightforge-worker.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          python -m pytest || { cat /tmp/insightforge-worker.log; exit 1; }
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
