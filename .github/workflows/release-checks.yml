name: Release checks
on:
  pull_request:
  push:
    branches: [main, feature/m8-production-readiness]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t insightforge-${{ matrix.component }}:ci ./${{ matrix.component }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: insightforge-${{ matrix.component }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pipx run pip-audit --strict -r backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
  infrastructure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/staging
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
      - run: terraform test
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform/staging
          severity: HIGH,CRITICAL
          exit-code: '1'
