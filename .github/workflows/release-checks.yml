name: Release checks
on:
  pull_request:
  push:
    branches: [main, feature/m8-production-readiness]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --pull -t insightforge-${{ matrix.component }}:ci ./${{ matrix.component }}
      - name: Record patched libzstd1 version
        if: matrix.component == 'backend'
        run: docker run --rm --network none --entrypoint dpkg-query insightforge-backend:ci -W libzstd1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: insightforge-${{ matrix.component }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
  python-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        requirements: [requirements.txt, requirements-dev.txt]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit with Python 3.12
        env:
          REQUIREMENTS: ${{ matrix.requirements }}
        run: |
          python -m venv "${RUNNER_TEMP}/python-audit"
          audit_python="${RUNNER_TEMP}/python-audit/bin/python"
          "$audit_python" --version
          "$audit_python" -m pip install pip-audit==2.10.1
          "$audit_python" -m pip_audit --version
          "$audit_python" -m pip_audit --strict -r "backend/$REQUIREMENTS"
  npm-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: complete
            options: ''
          - scope: production
            options: --omit=dev
    name: npm-audit (${{ matrix.scope }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm audit --audit-level=high ${{ matrix.options }}
        working-directory: frontend
  infrastructure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/staging
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
      - run: terraform test
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform/staging
          severity: HIGH,CRITICAL
          exit-code: '1'
